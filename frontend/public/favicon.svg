<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Dark Shell -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181d28" />
      <stop offset="100%" stop-color="#090c10" />
    </linearGradient>

    <!-- 3D Gold Accent Gradient -->
    <linearGradient id="goldTileGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Top Highlight -->
    <linearGradient id="highlightGrad" x1="10" y1="8" x2="54" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Dark Squircle Frame -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- 3D Glowing Gold Tile -->
  <rect x="7" y="7" width="50" height="50" rx="14" fill="url(#goldTileGrad)" filter="url(#tileGlow)" stroke="rgba(255,255,255,0.35)" stroke-width="1" />

  <!-- Specular Sheen -->
  <rect x="8" y="8" width="48" height="24" rx="13" fill="url(#highlightGrad)" />

  <!-- YouTube Play Triangle with Autonomous Spark Silhouette -->
  <path d="M26 21.5C26 20.2 27.4 19.4 28.5 20.1L43.5 29.6C44.5 30.2 44.5 31.8 43.5 32.4L28.5 41.9C27.4 42.6 26 41.8 26 40.5V21.5Z" fill="#ffffff" />

  <!-- Autonomous Green Pulse Indicator Dot -->
  <circle cx="49" cy="15" r="4.5" fill="#10b981" stroke="#090c10" stroke-width="1.5" />
  <circle cx="49" cy="15" r="2" fill="#ffffff" />
</svg>
