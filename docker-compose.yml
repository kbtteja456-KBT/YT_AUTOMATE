version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: yt_autopilot_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=youtube_autopilot

  redis:
    image: redis:7-alpine
    container_name: yt_autopilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: yt_autopilot_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - ZERO_COST_MODE=true
      - TIMEZONE=Asia/Kolkata
    volumes:
      - ./media_storage:/app/media_storage
    depends_on:
      - mongodb
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: yt_autopilot_celery_worker
    restart: always
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - ZERO_COST_MODE=true
      - TIMEZONE=Asia/Kolkata
    volumes:
      - ./media_storage:/app/media_storage
    depends_on:
      - mongodb
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: yt_autopilot_celery_beat
    restart: always
    command: celery -A backend.app.celery_app.celery beat --loglevel=info
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - TIMEZONE=Asia/Kolkata
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yt_autopilot_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
